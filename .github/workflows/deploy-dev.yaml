name: deploy-dev
on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENCE"
      - "CODEOWNERS"
    branches:
      - master
permissions:
    contents: write
    packages: write
    id-token: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest-8-cores
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      telemetry: ${{ steps.docker-push.outputs.telemetry }}
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22.11.0'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
          cache: 'pnpm'
      - name: install dependencies
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: pnpm install --frozen-lockfile
      - name: check formatting
        run: pnpm prettier:check
      - name: lint
        run: pnpm eslint
      - name: test
        run: pnpm test
        env:
          CI: true
      - name: build
        run: |
          BRANCH_NAME=$GITHUB_REF
          BUILD_NUMBER="$(date "+%Y.%m.%d")-$(git rev-parse --short HEAD)"
          pnpm build
      - name: Build and publish Docker images (multi-arch)
        id: docker-push
        uses: nais/docker-build-push@v0
        with:
          team: teammelosys
          tag: |
              type=raw,value=latest,priority=9001
              type=raw,value=${{ github.sha }},priority=9000
          platforms: linux/amd64,linux/arm64
          salsa: true

  deploy:
    runs-on: ubuntu-latest-8-cores
    needs: build
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: pre-deploy
        uses: navikt/digihot-deploy/actions/pre-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy q2
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/nais.yaml
          IMAGE: ${{ needs.build.outputs.image }}
          VARS: nais/vars-q2.json
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "${{ job.status == 'success' && 'good' || 'danger' }}"
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: "melosys-web ${{ job.status == 'success' && 'ble deployet' || 'kunne ikke deployes' }} til q2"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: ${{ env.COMMIT_MSG }}
      - name: post-deploy
        uses: navikt/digihot-deploy/actions/post-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: draft release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.APPLICATION }} ${{ env.VERSION_TAG }}
          body: ${{ env.CHANGE_LOG }}
          draft: true
          prerelease: false

  trigger-e2e-tests:
    name: Trigger E2E tests
    runs-on: ubuntu-latest
    needs: [ build, deploy ]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7.0.0
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Trigger E2E tests in melosys-e2e-tests
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.E2E_TRIGGER_PAT }}
          repository: navikt/melosys-e2e-tests
          event-type: melosys-web-published
          client-payload: |
            {
              "repository": "melosys-web",
              "image_tag": "${{ github.sha }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ env.COMMIT_MSG }}",
              "actor": "${{ github.actor }}"
            }
