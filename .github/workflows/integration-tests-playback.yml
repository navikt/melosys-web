name: Integration Tests (Playback)

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      stability_runs:
        description: "Number of stability test runs (1 = normal single run)"
        required: false
        default: "1"
        type: string

jobs:
  integration-tests-playback:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"  # Use latest Node 22.x (Vite requires 22.12+)
          registry-url: https://npm.pkg.github.com/
          scope: "@navikt"
          cache: "pnpm"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm list @playwright/test --depth=0 --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install only system dependencies (if browsers were cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build mock server
        run: |
          pnpm e2e:mock:install
          pnpm e2e:mock:build

      - name: Run integration tests (playback mode)
        id: tests
        shell: bash {0}
        run: |
          RUNS=${{ inputs.stability_runs || '1' }}

          if [ "$RUNS" -eq 1 ]; then
            # Single run - normal behavior
            pnpm test:e2e:playback
            exit $?
          else
            # Stability test - multiple runs
            PASSED=0
            FAILED=0
            RESULTS=""

            echo "Running E2E playback tests $RUNS times..."
            mkdir -p tests/e2e/reports/stability-logs

            for i in $(seq 1 $RUNS); do
              echo "::group::Run $i/$RUNS"
              LOG_FILE="tests/e2e/reports/stability-logs/run-$i.log"

              E2E_MODE=playback npx playwright test --reporter=dot 2>&1 | tee "$LOG_FILE"
              EXIT_CODE=${PIPESTATUS[0]}

              if [ $EXIT_CODE -eq 0 ]; then
                ((PASSED++))
                RESULTS="$RESULTS| $i | ✅ Pass |\n"
                echo "Run $i: PASSED"
                rm "$LOG_FILE"
              else
                ((FAILED++))
                RESULTS="$RESULTS| $i | ❌ Fail |\n"
                echo "Run $i: FAILED (exit code: $EXIT_CODE)"
              fi
              echo "::endgroup::"
            done

            SUCCESS_RATE=$(echo "scale=1; $PASSED * 100 / $RUNS" | bc)

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "total=$RUNS" >> $GITHUB_OUTPUT
            echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
            echo -e "$RESULTS" > tests/e2e/reports/stability-results.txt

            if [ $FAILED -gt 0 ]; then
              exit 1
            fi
          fi
        env:
          CI: true

      - name: Generate test summary
        if: always()
        run: |
          RUNS=${{ inputs.stability_runs || '1' }}

          if [ "$RUNS" -gt 1 ]; then
            # Stability test summary
            PASSED=${{ steps.tests.outputs.passed || '0' }}
            FAILED=${{ steps.tests.outputs.failed || '0' }}
            TOTAL=${{ steps.tests.outputs.total || inputs.stability_runs }}
            SUCCESS_RATE=${{ steps.tests.outputs.success_rate || '0' }}

            if [ "$FAILED" -eq 0 ]; then
              STATUS="✅ All runs passed"
            else
              STATUS="❌ Some runs failed"
            fi

            cat >> $GITHUB_STEP_SUMMARY << EOF
          # E2E Stability Test Report

          ## Summary

          | Metric | Value |
          |--------|-------|
          | Total Runs | $TOTAL |
          | Passed | $PASSED |
          | Failed | $FAILED |
          | Success Rate | ${SUCCESS_RATE}% |
          | Status | $STATUS |

          ## Run Results

          | Run | Result |
          |-----|--------|
          EOF

            if [ -f "tests/e2e/reports/stability-results.txt" ]; then
              cat tests/e2e/reports/stability-results.txt >> $GITHUB_STEP_SUMMARY
            fi
          else
            # Single run summary
            if [ -f "tests/e2e/reports/test-summary.md" ]; then
              cat tests/e2e/reports/test-summary.md >> $GITHUB_STEP_SUMMARY
            else
              echo "## ⚠️ No test summary found" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the full HTML report from the artifacts below." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/reports/playwright-report/
            tests/e2e/reports/test-summary.md
            tests/e2e/reports/test-summary.json
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: |
            tests/e2e/artifacts/
            tests/e2e/reports/stability-logs/
          retention-days: 7
