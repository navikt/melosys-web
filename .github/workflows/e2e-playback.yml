name: E2E Tests (Playback)

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  e2e-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"  # Use latest Node 22.x (Vite requires 22.12+)
          registry-url: https://npm.pkg.github.com/
          scope: "@navikt"
          cache: "pnpm"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build mock server
        run: |
          pnpm e2e:mock:install
          pnpm e2e:mock:build

      - name: Run E2E tests (playback mode)
        run: pnpm test:e2e:playback
        env:
          CI: true

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🎭 E2E Playback Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Use custom reporter summary if available
          if [ -f "tests/e2e/reports/test-summary.md" ]; then
            cat tests/e2e/reports/test-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test summary found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the full HTML report from the artifacts below." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/reports/playwright-report/
            tests/e2e/reports/test-summary.md
            tests/e2e/reports/test-summary.json
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: tests/e2e/artifacts/
          retention-days: 7
