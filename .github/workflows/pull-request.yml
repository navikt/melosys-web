name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Cache
        uses: actions/cache@v1
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: '12.3.1'

      - name: npm install
        run: npm i

      - name: build css
        run: npm run build:css

      - name: lint
        run: npm run eslint

      - name: test
        run:  npm run test:ci
        env:
          CI: true

      - name: build
        run:  npm build

      # - name: To github registry
