name: Build

on: pull_request

# Trengs for at coverage-rapporten kan postes som PR-kommentar
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest-8-cores

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22.11.0'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
          cache: 'pnpm'

      - name: install dependencies
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: pnpm install --frozen-lockfile

      - name: check formatting
        run: pnpm prettier:check

      - name: lint
        run: pnpm eslint

      - name: test
        run: pnpm test:coverage
        env:
          CI: true

      # Poster en dekningstabell (totalt + endrede filer) som PR-kommentar,
      # og skriver den til job-sammendraget. Leser coverage/coverage-summary.json
      # + coverage-final.json (vitest json/json-summary-reporterne).
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

      # HTML-rapporten lastes opp som artefakt for detaljert gjennomgang.
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: coverage/
          retention-days: 14

      - name: build
        run: |
          BRANCH_NAME=$GITHUB_REF
          BUILD_NUMBER="$(date "+%Y.%m.%d")-$(git rev-parse --short HEAD)"
          pnpm build
