apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  labels:
    team: teammelosys
  name: melosys-web-redis
  namespace: t8
spec:
  image: redis:5-alpine
  port: 6379
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    port: 6379
