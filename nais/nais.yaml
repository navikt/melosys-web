apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{APP_NAME}}
  namespace: teammelosys
  labels:
    team: teammelosys
  annotations:
    nais.io/read-only-file-system: "false"
    nais.io/run-as-user: "1069"
    nais.io/run-as-group: "1069"
spec:
  image: {{image}}
  port: 3000
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: melosys/health/is-alive
    initialDelay: 30
    timeout: 10
  readiness:
    path: melosys/health/is-ready
    initialDelay: 30
    timeout: 10
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  azure:
    application:
      enabled: true
      tenant: {{TENANT_URL}}
      replyURLs:
        - {{INGRESS}}
        - {{REPLY_URL}} # Workaround: For prod må REPLY_URL være samme som INGRESS i vars-prod.json. Dette for å ha localhost:3000 i tillegg til INGRESS i dev, men kun ha INGRESS i prod.
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: {{GROUP_MELOSYS_INNLOGGING}}
      allowAllUsers: false
      singlePageApplication: true
    sidecar:
      enabled: true
      autoLogin: true
      errorPath: "/error"
  accessPolicy:
    outbound:
      rules:
        - application: {{APP_NAME_API}}
        - application: {{APP_NAME_OPPGAVE_API}}
  vault:
    enabled: true
  ingresses:
    - {{INGRESS}}
  env:
    - name: REDIS_HOST
      value: {{REDIS_APP_NAME}}.teammelosys.svc.nais.local
    - name: APP_URL_MELOSYS
      value: {{APP_URL_MELOSYS}}
    - name: APP_URL_TRYGDEAVTALE
      value: {{APP_URL_TRYGDEAVTALE}}
