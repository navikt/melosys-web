apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{APP_NAME}}
  namespace: teammelosys
  labels:
    team: teammelosys
  annotations:
    nais.io/run-as-user: "65532"
    nais.io/run-as-group: "65532"
spec:
  image: {{image}}
  port: 3000
  env:
    - name: APP_URL_MELOSYS
      value: "{{APP_URL_MELOSYS}}"
    - name: APP_URL_TRYGDEAVTALE
      value: "{{APP_URL_TRYGDEAVTALE}}"
    - name: APP_URL_FAKTURERINGSKOMPONENTEN
      value: "{{APP_URL_FAKTURERINGSKOMPONENTEN}}"
    - name: FRONTEND_APP_NAME
      value: "{{FRONTEND_APP_NAME}}"
    - name: AZURE_CLIENT_ID
      value: "{{AZURE_CLIENT_ID}}"
    - name: AZURE_CLIENT_NAME
      value: "{{AZURE_CLIENT_NAME}}"
    - name: CLUSTER_NAME
      value: "{{CLUSTER_NAME}}"
    - name: FAKTURERINGSKOMPONENTEN_CLUSTER
      value: "{{FAKTURERINGSKOMPONENTEN_CLUSTER}}"
    - name: APP_NAME_FAKTURERINGSKOMPONENTEN_API
      value: "{{APP_NAME_FAKTURERINGSKOMPONENTEN_API}}"
    - name: APP_NAME_TRYGDEAVTALE_API
      value: "{{APP_NAME_TRYGDEAVTALE_API}}"
    - name: APP_NAME_API
      value: "{{APP_NAME_API}}"
    - name: ENVIRONMENT_NAME
      value: "{{ENVIRONMENT_NAME}}"
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: internal/health/liveness
    initialDelay: 30
    timeout: 10
  readiness:
    path: internal/health/readiness
    initialDelay: 30
    timeout: 10
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  azure:
    application:
      enabled: true
      tenant: {{TENANT_URL}}
      {{#if INGRESSES}}
      replyURLs:
        {{#each INGRESSES}}
        - "{{this}}"
        {{/each}}
      {{/if}}
      {{#if REPLY_URL}}
        - {{REPLY_URL}} # Workaround: For prod må REPLY_URL være samme som INGRESS i vars-prod.json. Dette for å ha localhost:3000 i tillegg til INGRESS i dev, men kun ha INGRESS i prod.
      {{/if}}
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: {{GROUP_MELOSYS_INNLOGGING}}
      allowAllUsers: false
      singlePageApplication: true
  accessPolicy:
    outbound:
      rules:
        - application: {{APP_NAME_API}}
        - application: {{APP_NAME_TRYGDEAVTALE_API}}
        - application: {{APP_NAME_FAKTURERINGSKOMPONENTEN_API}}
  vault:
    enabled: true
  {{#if INGRESSES}}
  ingresses:
    {{#each INGRESSES}}
    - "{{this}}"
    {{/each}}
  {{/if}}
