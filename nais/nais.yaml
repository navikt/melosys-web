apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{APP_NAME}}
  namespace: teammelosys
  labels:
    team: teammelosys
  annotations:
    nais.io/run-as-user: "65532"
    nais.io/run-as-group: "65532"
spec:
  image: {{image}}
  port: 3000
  filesFrom:
    - configmap: {{APP_NAME}}-runtime-config
      mountPath: /etc/nginx/conf.d
    # Rotfilsystemet er skrivebeskyttet (Nais-standard). Nginx trenger å skrive
    # to steder: pid-fila i /run og temp-filer i /var/lib/nginx/tmp.
    - emptyDir:
        medium: Memory
      mountPath: /run
    # Disk, ikke Memory: her havner store request-body-er og proxy-buffere, og
    # et Memory-volum ville telt mot minnegrensa på 512Mi.
    - emptyDir:
        medium: Disk
      mountPath: /var/lib/nginx/tmp
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: melosys/health/is-alive
    initialDelay: 30
    timeout: 10
  readiness:
    path: melosys/health/is-ready
    initialDelay: 30
    timeout: 10
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  azure:
    application:
      enabled: true
      tenant: {{TENANT_URL}}
      {{#if INGRESSES}}
      replyURLs:
        {{#each INGRESSES}}
        - "{{this}}"
        {{/each}}
      {{/if}}
      {{#if REPLY_URL}}
        - {{REPLY_URL}} # Workaround: For prod må REPLY_URL være samme som INGRESS i vars-prod.json. Dette for å ha localhost:3000 i tillegg til INGRESS i dev, men kun ha INGRESS i prod.
      {{/if}}
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: {{GROUP_MELOSYS_INNLOGGING}}
      allowAllUsers: false
      singlePageApplication: true
  accessPolicy:
    outbound:
      rules:
        - application: {{APP_NAME_API}}
        - application: {{APP_NAME_TRYGDEAVTALE_API}}
        - application: {{APP_NAME_FAKTURERINGSKOMPONENTEN_API}}
  vault:
    enabled: true
  {{#if INGRESSES}}
  ingresses:
    {{#each INGRESSES}}
    - "{{this}}"
    {{/each}}
  {{/if}}
