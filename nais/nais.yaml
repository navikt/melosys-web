apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: {{APP_NAME}}
  namespace: teammelosys
  labels:
    team: teammelosys
  annotations:
    nais.io/read-only-file-system: "false"
    nais.io/run-as-user: "1069"
    nais.io/run-as-group: "1069"
spec:
  image: {{image}}
  port: 3000
  replicas:
    min: 2
    max: 2
    cpuThresholdPercentage: 50
  liveness:
    path: melosys/health/is-alive
    initialDelay: 30
    timeout: 10
  readiness:
    path: melosys/health/is-ready
    initialDelay: 30
    timeout: 10
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  vault:
    enabled: true
  ingresses:
    - {{INGRESS}}
  env:
    - name: APP_URL_MELOSYS
      value: {{APP_URL_MELOSYS}}
    - name: APP_URL_TRYGDEAVTALE
      value: {{APP_URL_TRYGDEAVTALE}}
    - name: OIDC_HOST_URL
      value: {{ OIDC_HOST_URL }}
